backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: "https://jollysdoo.netlify.app"
display_url: "https://jollysdoo.netlify.app"

collections:
  - name: "settings"
    label: "Urejanje strani"
    files:
      - name: "site"
        label: "Hero, teksti, projekti, kontakt"
        file: "data/site.json"
        format: "json"
        fields:
          - label: "Hero sekcija"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Majhen napis", name: "eyebrow", widget: "string" }
              - { label: "Glavni naslov", name: "title", widget: "string" }
              - { label: "Opis", name: "text", widget: "text" }
              - { label: "Hero slika", name: "image", widget: "image", hint: "Priporočeno 3200 x 1900 px JPG" }
          - label: "Uvodna sekcija"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Majhen napis", name: "eyebrow", widget: "string" }
              - { label: "Naslov", name: "title", widget: "string" }
              - { label: "Tekst", name: "text", widget: "text" }
          - label: "Projekti"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Naslov projekta", name: "title", widget: "string" }
              - { label: "Opis", name: "text", widget: "text" }
              - { label: "Slika projekta", name: "image", widget: "image", hint: "Priporočeno 1600 x 1600 px" }
          - label: "Storitve"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Naslov", name: "title", widget: "string" }
              - { label: "Opis", name: "text", widget: "text" }
          - label: "Kontakt"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Naslov", name: "title", widget: "string" }
              - { label: "Tekst", name: "text", widget: "text" }
              - { label: "Telefon", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Naslov", name: "address", widget: "string" }
