backend:
  name: git-gateway
  branch: main
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
locale: "sl"
collections:
  - name: "settings"
    label: "Urejanje strani"
    files:
      - file: "data/content.json"
        label: "Glavna stran"
        name: "content"
        fields:
          - label: "Logo in ime"
            name: "site"
            widget: "object"
            fields:
              - {label: "Ime", name: "brandName", widget: "string"}
              - {label: "Podnapis", name: "brandSub", widget: "string"}
              - {label: "Črka logota", name: "logoLetter", widget: "string"}
          - label: "Hero prva stran"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Mali naslov", name: "eyebrow", widget: "string"}
              - {label: "Veliki naslov", name: "title", widget: "string"}
              - {label: "Besedilo", name: "text", widget: "text"}
              - {label: "Hero slika 3200x1900", name: "image", widget: "image"}
          - label: "Uvod"
            name: "intro"
            widget: "object"
            fields:
              - {label: "Naslov", name: "title", widget: "string"}
              - {label: "Besedilo", name: "text", widget: "text"}
          - label: "Materiali"
            name: "materials"
            widget: "object"
            fields:
              - {label: "Naslov", name: "title", widget: "string"}
              - {label: "Besedilo", name: "text", widget: "text"}
              - {label: "Slika", name: "image", widget: "image"}
          - label: "Kontakt"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Naslov", name: "title", widget: "string"}
              - {label: "Besedilo", name: "text", widget: "text"}
              - {label: "Telefon", name: "phone", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Naslov", name: "address", widget: "string"}
          - label: "Storitve"
            name: "services"
            widget: "list"
            fields:
              - {label: "Naslov", name: "title", widget: "string"}
              - {label: "Besedilo", name: "text", widget: "text"}
          - label: "Projekti"
            name: "projects"
            widget: "list"
            fields:
              - {label: "Naslov", name: "title", widget: "string"}
              - {label: "Kategorija", name: "category", widget: "string"}
              - {label: "Opis", name: "text", widget: "text"}
              - {label: "Slika 1:1 1600x1600", name: "image", widget: "image"}
